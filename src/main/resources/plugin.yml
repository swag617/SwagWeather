name: SwagWeather
version: '${project.version}'
main: com.swag.weather.SwagWeather
api-version: 1.21
depend: [SwagAPI]
commands:
  sweather:
    description: SwagWeather command
    usage: /<command> <status|forecast|force|season|reload|claim> [args]
    aliases: [weather, sw]
# No command-level `permission:` here (unlike SwagTags/SwagRestartScheduler's usual
# single-permission-per-command idiom) — this command now mixes admin-only
# subcommands with the player-facing `claim` subcommand, so permission is instead
# checked per-subcommand inside SwagWeatherCommand.
permissions:
  swagweather.admin:
    description: Allows access to SwagWeather admin commands (status/forecast/force/season/reload)
    default: op
  swagweather.claim:
    description: Allows setting a personal cosmetic weather override inside a GriefPrevention claim you can edit
    default: true
